<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librería UAM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>📚 Librería UAM</h1>
  <nav>
    <button class="tab-btn active" data-tab="clientes">Clientes</button>
    <button class="tab-btn" data-tab="libros">Libros</button>
    <button class="tab-btn" data-tab="ventas">Vender</button>
  </nav>
</header>

<main>
  <!-- Sección Clientes -->
  <section id="clientes" class="tab-content active">
    <h2>Gestión de Clientes</h2>
    <form id="form-cliente">
      <input type="hidden" id="cliente-id">
      <input type="text" id="cliente-nombre" placeholder="Nombre" required>
      <input type="email" id="cliente-email" placeholder="Email" required>
      <input type="text" id="cliente-telefono" placeholder="Teléfono">
      <input type="text" id="cliente-matricula" placeholder="Matrícula (ej: A1234)">
      <button type="submit">Guardar</button>
      <button type="button" id="cancelar-cliente">Cancelar</button>
    </form>
    <table id="tabla-clientes">
      <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Matrícula</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Sección Libros -->
  <section id="libros" class="tab-content">
    <h2>Catálogo de Libros</h2>
    <form id="form-libro">
      <input type="hidden" id="libro-id">
      <input type="text" id="libro-titulo" placeholder="Título" required>
      <input type="text" id="libro-autor" placeholder="Autor" required>
      <input type="number" id="libro-precio" placeholder="Precio" min="0" step="0.01" required>
      <input type="number" id="libro-stock" placeholder="Stock" min="0" required>
      <button type="submit">Guardar</button>
      <button type="button" id="cancelar-libro">Cancelar</button>
    </form>
    <div class="search">
      <input type="text" id="buscar-libro" placeholder="Buscar por título/autor...">
    </div>
    <div id="lista-libros" class="grid-container"></div>
  </section>

  <!-- Sección Ventas -->
  <section id="ventas" class="tab-content">
    <h2>Proceso de Venta</h2>
    <div class="venta-container">
      <div class="carrito">
        <h3>Carrito</h3>
        <select id="cliente-venta">
          <option value="">Seleccione cliente</option>
        </select>
        <ul id="items-carrito"></ul>
        <div class="total">
          <p>Subtotal: $<span id="subtotal">0.00</span></p>
          <p>Descuento: <input type="number" id="descuento" min="0" max="100" value="0">%</p>
          <p>Total: $<span id="total-venta">0.00</span></p>
          <button id="finalizar-venta">Finalizar Venta</button>
        </div>
      </div>
      <div id="ticket-preview" class="ticket"></div>
    </div>
  </section>
</main>

<script src="scripts.js"></script>
</body>
</html>
